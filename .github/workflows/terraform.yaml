name: "Vprofile IAC"

on:
  pull_request:
    branches: [main]

  workflow_dispatch:

jobs:
  terraform_plan:
    name: Terraform validate and plan
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    outputs:
      drift_detected: ${{ steps.plan.outputs.drift_detected }}

    steps:
      - name: code checkout
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.0

      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=${{ secrets.BUCKET_TF_STATE }}"

      - name: Terraform validate
        run: terraform validate

      - name: Terraform plan
        id: plan
        run: |
          set +e
          terraform plan -detailed-exitcode -input=false -out=tfplan
          plan_exit_code=$?
          set -e
          if [ "$plan_exit_code" -eq 0 ]; then
            echo "drift_detected=false" >> $GITHUB_OUTPUT
          elif [ "$plan_exit_code" -eq 2 ]; then
            echo "drift_detected=true" >> $GITHUB_OUTPUT
          else
            exit $plan_exit_code
          fi


  drift_comment:
    name: Post drift comment
    runs-on: ubuntu-latest
    needs: terraform_plan
    if: github.event_name == 'pull_request' && needs.terraform_plan.outputs.drift_detected == 'true'

    steps:
      - name: Post PR comment with apply link
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const body = `## Terraform drift detected
            Drift was detected between the Terraform configuration and the live EKS cluster.
            [Apply the Terraform changes manually](https://github.com/${context.repo.owner}/${context.repo.repo}/actions/workflows/terraform.yaml/dispatches)`;
            await github.issues.createComment({
              ...context.repo,
              issue_number: context.issue.number,
              body,
            });

  terraform_apply:
    name: Terraform apply (manual)
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v1
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: us-east-1

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v2
        with:
          terraform_version: 1.7.0

      - name: Terraform init
        run: terraform init -input=false -backend-config="bucket=${{ secrets.BUCKET_TF_STATE }}"

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Terraform apply
        run: terraform apply -auto-approve -input=false tfplan

  slack_notification:
    name: Notify Slack on Terraform plan job
    runs-on: ubuntu-latest
    needs: terraform_plan
    if: success()

    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
              "text": "Terraform plan completed for `${{ github.repository }}` on `${{ github.ref_name }}` via `${{ github.event_name }}`. Drift detected: `${{ needs.terraform_plan.outputs.drift_detected }}`. Apply manually: https://github.com/${{ github.repository }}/actions/workflows/terraform.yaml/dispatches",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "*Terraform plan completed* for `<https://github.com/${{ github.repository }}|${{ github.repository }}>` on *${{ github.ref_name }}* via `${{ github.event_name }}`. Drift detected: `${{ needs.terraform_plan.outputs.drift_detected }}`."
                  }
                }
              ]
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}

  slack_apply_notification:
    name: Notify Slack on terraform apply job
    runs-on: ubuntu-latest
    needs: terraform_apply
    if: always() && github.event_name == 'workflow_dispatch'

    steps:
      - name: Notify Slack
        uses: slackapi/slack-github-action@v1.25.0
        with:
          payload: |
            {
            "text": "Terraform apply for `${{ github.repository }}` finished with status: `${{ needs.terraform_apply.result }}`"
            }
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}